# Casbin 访问控制模型配置文件

# 1. 请求定义 (Request Definition)
# 定义了访问请求的参数结构。
# r = sub, obj, act 表示一个请求包含三个参数：
#   - sub (Subject): 访问实体（通常是用户或角色）。
#   - obj (Object): 被访问的资源（通常是 URL 路径或数据对象）。
#   - act (Action): 对资源执行的操作（通常是 HTTP 方法，如 GET, POST, PUT, DELETE）。
[request_definition]
r = sub, obj, act

# 2. 策略定义 (Policy Definition)
# 定义了权限策略的结构。
# p = sub, obj, act 表示一条策略规则也包含三个参数，与请求定义对应。
# 例如：p, alice, /data1, read 表示用户 alice 对资源 /data1 有读取权限。
[policy_definition]
p = sub, obj, act

# 3. 角色定义 (Role Definition)
# 定义了角色继承关系 (用户到角色，或角色到角色的映射)。
# g = _, _ 表示一个角色继承关系包含两个参数：
#   - 第一个参数是用户或子角色。
#   - 第二个参数是其所属的角色。
# 例如：g, alice, role_admin 表示用户 alice 属于 role_admin 角色。
# 例如：g, role_editor, role_admin 表示角色 role_editor 继承了 role_admin 的权限。
[role_definition]
g = _, _

# 4. 策略效果 (Policy Effect)
# 定义了当多条策略规则匹配一个请求时，如何决定最终的访问权限。
# e = some(where (p.eft == allow)) 表示：
#   - 如果至少有一条匹配的策略规则的效果 (p.eft) 是 allow (允许)，则最终结果为允许。
#   - 这意味着默认是拒绝，除非有明确的允许策略。
#   - p.eft 是策略规则中可选的第四个参数，用于指定效果 (allow 或 deny)。
#     如果策略定义中没有指定 eft (如本例中的 p = sub, obj, act)，则 Casbin 默认所有策略都是 allow 效果。
[policy_effect]
e = some(where (p.eft == allow))

# 5. 匹配器 (Matchers)
# 定义了如何根据请求参数和策略规则进行匹配。
# m = g(r.sub, p.sub) && keyMatch2(r.obj, p.obj) && regexMatch(r.act, p.act) 表示：
#   - g(r.sub, p.sub):
#     - 检查请求的 subject (r.sub) 是否属于策略规则中的 subject (p.sub) 代表的角色。
#     - g 是 Casbin 内置的函数，用于处理角色继承。
#     - 例如，如果 r.sub 是 "alice"，p.sub 是 "role_admin"，并且存在 "g, alice, role_admin" 的角色定义，则此部分为 true。
#   - keyMatch2(r.obj, p.obj):
#     - 检查请求的 object (r.obj) 是否匹配策略规则中的 object (p.obj)。
#     - keyMatch2 是 Casbin 内置的函数，支持路径通配符，例如 /resource/:id。
#     - 例如，如果 r.obj 是 "/users/123"，p.obj 是 "/users/:id"，则此部分为 true。
#     - 如果 r.obj 是 "/admin/dashboard"，p.obj 是 "/admin/*"，则此部分也为 true。
#   - regexMatch(r.act, p.act):
#     - 检查请求的 action (r.act) 是否匹配策略规则中的 action (p.act) 定义的正则表达式。
#     - regexMatch 是 Casbin 内置的函数。
#     - 例如，如果 r.act 是 "GET"，p.act 是 "GET|POST"，则此部分为 true。
#     - 如果 r.act 是 "POST"，p.act 是 "GET|POST"，则此部分也为 true。
#     - 如果 r.act 是 "DELETE"，p.act 是 "GET|POST"，则此部分为 false。
#   - &&: 表示三个条件必须同时满足，请求才被认为是匹配的。
[matchers]
m = g(r.sub, p.sub) && keyMatch2(r.obj, p.obj) && regexMatch(r.act, p.act)
